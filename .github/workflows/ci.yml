name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Set up Go
        uses: actions/setup-go@v6.4.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify module downloads
        run: go mod verify

      - name: Check formatting
        run: |
          git ls-files -z '*.go' | xargs -0 gofmt -w
          git diff --exit-code

      - name: Vet
        run: go vet -tags sqlite_fts5 ./...

      - name: Test
        run: go test -tags sqlite_fts5 ./...

      - name: Race test
        run: go test -race -tags sqlite_fts5 ./...
