name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Set up Go
        uses: actions/setup-go@v6.4.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify module downloads
        run: go mod verify

      - name: Check formatting
        run: |
          git ls-files -z '*.go' | xargs -0 gofmt -w
          git diff --exit-code

      - name: Vet
        run: go vet -tags sqlite_fts5 ./...

      - name: Test
        run: go test -tags sqlite_fts5 ./...

      - name: Race test
        run: go test -race -tags sqlite_fts5 ./...

  windows-input:
    name: Windows input and atomic files
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2
      - name: Set up Go
        uses: actions/setup-go@v6.4.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Test native Windows input and file replacement
        env:
          CGO_ENABLED: "0"
        run: go test ./internal/tui/term ./internal/atomicfile -count=1

  windows-installer:
    name: Windows installer (${{ matrix.shell }})
    runs-on: windows-latest
    strategy:
      matrix:
        shell: [powershell, pwsh]
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2
      - name: Test installer checksum verification
        shell: ${{ matrix.shell }}
        run: ./.scripts/tests/install.ps1
