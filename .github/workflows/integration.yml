name: Integration

on:
  workflow_dispatch:
  schedule:
    - cron: "17 5 * * 1"

permissions:
  contents: read

jobs:
  postgres:
    name: PostgreSQL adapter
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: sqlgo
          POSTGRES_PASSWORD: sqlgo_dev
          POSTGRES_DB: sqlgo_test
        ports:
          - 15432:5432
        options: >-
          --health-cmd "pg_isready -U sqlgo -d sqlgo_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Set up Go
        uses: actions/setup-go@v6.4.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Run PostgreSQL integration tests
        run: go test -tags "sqlite_fts5 integration" ./internal/db/postgres
